<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin login — AskLilOwl</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #141414; }
    .login-card { max-width: 380px; margin: 8vh auto; border: 0; border-radius: 14px; }
    .login-brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 1.25rem; }
    .login-brand img:first-child { width: 52px; height: 53px; }
    .login-brand img:last-child { width: 132px; height: 27px; }
    .btn-owl { background: #EF9F27; border-color: #EF9F27; color: #412402; font-weight: 700; }
    .btn-owl:hover, .btn-owl:focus-visible { background: #FAC775; border-color: #FAC775; color: #412402; }
  </style>
</head>
<body>
  <main class="login-card card mx-3 mx-sm-auto">
    <div class="card-body p-4">
      <div class="login-brand">
        <img src="{{ url_for('static', filename='brand/owl-cutout.png') }}" alt="">
        <img src="{{ url_for('static', filename='brand/wordmark.png') }}" alt="AskLilOwl">
      </div>
      <h1 class="h4 mb-3 text-center">Admin login</h1>
      {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}
      <form method="post" action="{{ url_for('admin_login') }}">
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" autofocus required>
        </div>
        <button type="submit" class="btn btn-owl w-100">Sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
