<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oops — AskLilOwl</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='cinema-theme.css') }}">
</head>
<body class="cinema-page">
  <main class="error-page">
    <h1>Uh oh — something went wrong</h1>
    {% if question %}<p class="question">You asked: <em>"{{ question }}"</em></p>{% endif %}
    <pre class="error-detail">{{ error }}</pre>
    <a href="{{ url_for('home') }}" class="btn">← Try another question</a>
  </main>
</body>
</html>
